  <text x="252" y="64" fill="#E2E8F0" font-size="19" font-weight="500">Know how your application behaves at 3× load, before your customers do.</text>
  <text x="64" y="96" fill="#64748B" font-size="13" font-weight="700" letter-spacing="2">BAMS HACKATHON 2026 · PERFORMANCE ENGINEERING INTELLIGENCE</text>
