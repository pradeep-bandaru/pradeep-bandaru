<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="PerfOracle - predicts how an application behaves at 3x load">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1F"/><stop offset="1" stop-color="#151036"/></linearGradient>
  <linearGradient id="fl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
  <linearGradient id="tt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <style>
    .dash{animation:flow 1.4s linear infinite}
    
    @keyframes flow{to{stroke-dashoffset:-20}}
    @keyframes in{from{opacity:0}to{opacity:1}}
    @media (prefers-reduced-motion: reduce){.dash{animation:none}}
  </style>
</defs>
<rect width="1200" height="430" rx="22" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="1199" height="429" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
<g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
