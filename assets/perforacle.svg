  <line x1="110" y1="205" x2="1090" y2="205" stroke="url(#fl)" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" class="dash"/><g class="st" style="animation-delay:0.00s"><circle cx="110" cy="205" r="22" fill="#0F172A" stroke="#22D3EE" stroke-width="2.5"/><text x="110" y="211" text-anchor="middle" fill="#22D3EE" font-size="16" font-weight="800">1</text><text x="110" y="255" text-anchor="middle" fill="#E2E8F0" font-size="16" font-weight="700">Connect</text><text x="110" y="275" text-anchor="middle" fill="#94A3B8" font-size="13">20 tool formats</text></g><g class="st" style="animation-delay:0.15s"><circle cx="273" cy="205" r="22" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/><text x="273" y="211" text-anchor="middle" fill="#38BDF8" font-size="16" font-weight="800">2</text><text x="273" y="255" text-anchor="middle" fill="#E2E8F0" font-size="16" font-weight="700">Align</text><text x="273" y="275" text-anchor="middle" fill="#94A3B8" font-size="13">one clock</text></g><g class="st" style="animation-delay:0.30s"><circle cx="437" cy="205" r="22" fill="#0F172A" stroke="#60A5FA" stroke-width="2.5"/><text x="437" y="211" text-anchor="middle" fill="#60A5FA" font-size="16" font-weight="800">3</text><text x="437" y="255" text-anchor="middle" fill="#E2E8F0" font-size="16" font-weight="700">Understand</text><text x="437" y="275" text-anchor="middle" fill="#94A3B8" font-size="13">test phases</text></g><g class="st" style="animation-delay:0.45s"><circle cx="600" cy="205" r="22" fill="#0F172A" stroke="#818CF8" stroke-width="2.5"/><text x="600" y="211" text-anchor="middle" fill="#818CF8" font-size="16" font-weight="800">4</text><text x="600" y="255" text-anchor="middle" fill="#E2E8F0" font-size="16" font-weight="700">Correlate</text><text x="600" y="275" text-anchor="middle" fill="#94A3B8" font-size="13">every layer</text></g><g class="st" style="animation-delay:0.60s"><circle cx="763" cy="205" r="22" fill="#0F172A" stroke="#A78BFA" stroke-width="2.5"/><text x="763" y="211" text-anchor="middle" fill="#A78BFA" font-size="16" font-weight="800">5</text><text x="763" y="255" text-anchor="middle" fill="#E2E8F0" font-size="16" font-weight="700">Predict</text><text x="763" y="275" text-anchor="middle" fill="#94A3B8" font-size="13">1.5–7× load</text></g><g class="st" style="animation-delay:0.75s"><circle cx="927" cy="205" r="22" fill="#0F172A" stroke="#C084FC" stroke-width="2.5"/><text x="927" y="211" text-anchor="middle" fill="#C084FC" font-size="16" font-weight="800">6</text><text x="927" y="255" text-anchor="middle" fill="#E2E8F0" font-size="16" font-weight="700">Experiment</text><text x="927" y="275" text-anchor="middle" fill="#94A3B8" font-size="13">rank fixes</text></g><g class="st" style="animation-delay:0.90s"><circle cx="1090" cy="205" r="22" fill="#0F172A" stroke="#F472B6" stroke-width="2.5"/><text x="1090" y="211" text-anchor="middle" fill="#F472B6" font-size="16" font-weight="800">7</text><text x="1090" y="255" text-anchor="middle" fill="#E2E8F0" font-size="16" font-weight="700">Decide</text><text x="1090" y="275" text-anchor="middle" fill="#94A3B8" font-size="13">cited verdict</text></g>
  <rect x="64" y="312" width="251" height="86" rx="14" fill="#FFFFFF" fill-opacity=".04" stroke="#22D3EE" stroke-opacity=".35"/><text x="84" y="352" fill="#22D3EE" font-size="30" font-weight="800">2.7%</text><text x="84" y="374" fill="#E2E8F0" font-size="14" font-weight="600">median capacity error</text><text x="84" y="390" fill="#64748B" font-size="12">vs 45% linear baseline</text><rect x="332" y="312" width="251" height="86" rx="14" fill="#FFFFFF" fill-opacity=".04" stroke="#A78BFA" stroke-opacity=".35"/><text x="352" y="352" fill="#A78BFA" font-size="30" font-weight="800">93.8%</text><text x="352" y="374" fill="#E2E8F0" font-size="14" font-weight="600">go / no-go accuracy</text><text x="352" y="390" fill="#64748B" font-size="12">60 held-out scenarios</text><rect x="600" y="312" width="251" height="86" rx="14" fill="#FFFFFF" fill-opacity=".04" stroke="#F472B6" stroke-opacity=".35"/><text x="620" y="352" fill="#F472B6" font-size="30" font-weight="800">85%</text><text x="620" y="374" fill="#E2E8F0" font-size="14" font-weight="600">calibrated band coverage</text><text x="620" y="390" fill="#64748B" font-size="12">split-conformal</text><rect x="868" y="312" width="251" height="86" rx="14" fill="#FFFFFF" fill-opacity=".04" stroke="#34D399" stroke-opacity=".35"/><text x="888" y="352" fill="#34D399" font-size="30" font-weight="800">~3 s</text><text x="888" y="374" fill="#E2E8F0" font-size="14" font-weight="600">per investigation</text><text x="888" y="390" fill="#64748B" font-size="12">files → decision</text>
</g>
